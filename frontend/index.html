<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroLibrary AI</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f0c29,#302b63,#7b2cbf);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:15px;
width:350px;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}

button{
background:#7b2cbf;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>📚 NeuroLibrary AI</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Senha">

<button onclick="register()">Cadastrar</button>
<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<script>

const API="http://localhost:8000"

async function register(){

const res=await fetch(API+"/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:password.value
})
})

msg.innerText=await res.text()

}

async function login(){

const res=await fetch(API+"/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:password.value
})
})

msg.innerText=await res.text()

}

</script>

</body>
</html>
