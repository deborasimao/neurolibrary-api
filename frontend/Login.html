<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeuroLibrary AI • Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(270deg,#0f0c29,#302b63,#7b2cbf);
background-size:600% 600%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

.login-box{

background:rgba(255,255,255,0.05);
padding:40px;
border-radius:16px;
width:350px;

backdrop-filter:blur(20px);

box-shadow:
0 0 40px rgba(0,0,0,0.6),
0 0 80px rgba(123,44,191,0.3);

animation:fade 1s ease;

}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
color:white;
font-size:26px;
text-align:center;
margin-bottom:10px;
}

.subtitle{
color:#aaa;
text-align:center;
margin-bottom:30px;
font-size:14px;
}

input{

width:100%;
padding:14px;
margin-bottom:15px;

border:none;
border-radius:10px;

background:rgba(255,255,255,0.08);
color:white;

outline:none;
transition:0.3s;

}

input:focus{

box-shadow:0 0 10px #7b2cbf;

}

button{

width:100%;
padding:14px;

border:none;
border-radius:10px;

background:linear-gradient(45deg,#7b2cbf,#00d4ff);

color:white;
font-size:16px;
font-weight:600;

cursor:pointer;
transition:0.3s;

}

button:hover{

transform:scale(1.05);
box-shadow:0 0 20px #7b2cbf;

}

.msg{
color:#aaa;
text-align:center;
margin-top:10px;
}

</style>

</head>
<body>

<div class="login-box">

<div class="title">📚 NeuroLibrary AI</div>

<div class="subtitle">
Sistema inteligente de biblioteca
</div>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Senha">

<button onclick="login()" id="btn">
Entrar
</button>

<div class="msg" id="msg"></div>

</div>

<script>

const API="http://localhost:8000"

async function login(){

btn.innerText="Entrando..."

const res=await fetch(API+"/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email.value,
password:password.value

})

})

const data=await res.text()

msg.innerText=data

btn.innerText="Entrar"

}

</script>

</body>
</html>
