<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroLibrary Login</title>
<style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #6a0dad, #ff69b4);
    }

    .login-container {
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        width: 350px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        text-align: center;
        transition: transform 0.3s;
    }

    .login-container:hover { transform: translateY(-5px); }

    h2 { margin-bottom: 25px; color: #6a0dad; }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0 20px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #6a0dad;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover { background: #ff69b4; }

    .message { margin-top: 15px; font-weight: bold; }

    .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; cursor: pointer; }
    .tab { padding: 10px; font-weight: bold; color: #6a0dad; border-bottom: 2px solid transparent; transition: all 0.3s; }
    .tab.active { border-bottom: 2px solid #6a0dad; color: #ff69b4; }
</style>
</head>
<body>

<div class="login-container">
    <div class="tabs">
        <div class="tab active" id="tab-login">Login</div>
        <div class="tab" id="tab-register">Cadastro</div>
    </div>

    <h2 id="form-title">Login</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Senha">

    <button id="submit-btn">Entrar</button>

    <div class="message" id="message"></div>
</div>

<script>
const backendUrl = "https://neurolibrary-api-1.onrender.com";
let isLogin = true;

const tabLogin = document.getElementById("tab-login");
const tabRegister = document.getElementById("tab-register");
const formTitle = document.getElementById("form-title");
const submitBtn = document.getElementById("submit-btn");
const messageDiv = document.getElementById("message");

tabLogin.addEventListener("click", () => toggleForm(true));
tabRegister.addEventListener("click", () => toggleForm(false));

function toggleForm(login) {
    isLogin = login;
    formTitle.innerText = login ? "Login" : "Cadastro";
    submitBtn.innerText = login ? "Entrar" : "Registrar";
    tabLogin.classList.toggle("active", login);
    tabRegister.classList.toggle("active", !login);
    messageDiv.innerText = "";
}

submitBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        messageDiv.style.color = "red";
        messageDiv.innerText = "Preencha todos os campos!";
        return;
    }

    const endpoint = isLogin ? "/login" : "/register";

    try {
        const res = await fetch(backendUrl + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        messageDiv.style.color = data.msg.includes("sucesso") ? "green" : "red";
        messageDiv.innerText = data.msg;

        if (isLogin && data.msg.includes("sucesso")) {
            // Redireciona para dashboard (ainda simples)
            messageDiv.innerText += " - Bem-vindo!";
        }
    } catch (err) {
        messageDiv.style.color = "red";
        messageDiv.innerText = "Erro ao conectar com o servidor.";
        console.error(err);
    }
});
</script>

</body>
</html>
